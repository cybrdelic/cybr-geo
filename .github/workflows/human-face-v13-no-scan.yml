name: Procedural human face v13 no-scan verify

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/procedural-human-face-v13-no-scan'
    paths:
      - 'examples/procedural_human_face.py'
      - 'examples/human_face.py'
      - 'tools/procedural_face_materials.py'
      - 'tools/render_procedural_face.py'
      - 'tools/render_human_face.py'
      - 'tools/orbit_mitsuba_photo.py'
      - 'tests/test_procedural_human_face.py'
      - '.github/workflows/human-face-v13-no-scan.yml'

concurrency:
  group: human-face-v13-no-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 Pillow==12.3.0 trimesh==4.11.1 mitsuba==3.7.1 pytest==9.0.2 setuptools==82.0.1
          python -m pip install --no-deps -e .
      - name: Verify procedural no-scan geometry
        run: |
          PYTHONPATH=src python -m pytest -q tests/test_procedural_human_face.py
      - name: Enforce no external face inputs
        run: |
          python - <<'PY'
          import importlib.util, sys
          sys.path[:0]=['src','examples']
          spec=importlib.util.spec_from_file_location('face','examples/procedural_human_face.py')
          m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          a=m.build(m.FaceParameters(),quality='preview',hair=False)
          assert a.metadata['scan_used'] is False
          assert a.metadata['imported_anatomy_mesh'] is False
          assert a.metadata['photographic_skin_textures'] is False
          assert a.metadata['image_generation'] is False
          assert a.metadata['input_assets']==[]
          print('NO_SCAN_V13_OK')
          PY
      - name: Provision pinned OIDN
        run: |
          python - <<'PY'
          from mechanism_lab.v9 import ensure_oidn
          print(ensure_oidn())
          PY
      - name: Render v13 portrait
        run: |
          python tools/render_human_face.py --out build/v13/a --view portrait \
            --size 640x800 --spp 128 --depth 14 --threads 4 --quality preview \
            --texture-size 1024 --exposure 1.28 --seed 271828 --skip-export
      - name: Render v13 clay proof
        run: |
          python tools/render_human_face.py --out build/v13/clay --view portrait \
            --size 480x600 --spp 64 --depth 12 --threads 4 --quality preview \
            --texture-size 512 --exposure 1.12 --seed 271828 --clay --skip-export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cybr-geo-face-v13-no-scan
          path: |
            build/v13/a/CYBR_Procedural_Face_portrait.png
            build/v13/a/CYBR_Procedural_Face_portrait.json
            build/v13/clay/CYBR_Procedural_Face_portrait_clay.png
            build/v13/clay/CYBR_Procedural_Face_portrait_clay.json
          if-no-files-found: error
          retention-days: 30
