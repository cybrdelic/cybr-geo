name: FUSE C220 engineering qualification

on:
  push:
    branches: ['fix/fuse-c220-engineering']
    paths:
      - 'examples/fuse_c220/**'
      - 'tests/test_fuse_c220*'
      - '.github/workflows/fuse-c220-engineering.yml'
  pull_request:
    paths:
      - 'examples/fuse_c220/**'
      - 'tests/test_fuse_c220*'
      - '.github/workflows/fuse-c220-engineering.yml'
  workflow_dispatch:

concurrency:
  group: fuse-c220-engineering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: src:examples/fuse_c220
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CAD environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libgl1-mesa-dri libglu1-mesa
          python -m pip install -r requirements-tested.txt
          python -m pip install --no-deps -e .
      - name: Compile printer engineering sources
        run: python -m compileall -q examples/fuse_c220 tests/test_fuse_c220_functional_paths.py
      - name: Re-run recovered mechanism hotend and G-code regressions
        run: python -m pytest -q tests/test_fuse_c220_recovery.py tests/test_fuse_c220_functional_paths.py
      - name: Rebuild and verify nominal mechanism
        run: |
          mkdir -p deliverables build/fuse-c220-engineering
          python examples/fuse_c220/verify_mechanism.py
          python examples/fuse_c220/verify_edges.py
          python - <<'PY'
          import json, pathlib
          import printer, verify_hotend
          r=verify_hotend.verify(printer.build())
          pathlib.Path('deliverables/FUSE_C220_hotend_validation.json').write_text(json.dumps(r,indent=2)+'\n')
          assert r['all_passed'],r
          PY
      - name: Run multidisciplinary engineering screening
        run: python examples/fuse_c220/engineering_qualify.py --out build/fuse-c220-engineering
      - name: Export CYBR PHYSICS handoff
        run: python examples/fuse_c220/export_cybr_physics_manifest.py --out build/fuse-c220-engineering
      - name: Gate computational defects and preserve physical unknowns
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('build/fuse-c220-engineering/FUSE_C220_engineering_report.json').read_text())
          assert r['model']=='CYBR FUSE C220'
          assert not r['critical_failures'],r['critical_failures']
          assert r['release_ready'] is False
          required={'hotend thermal performance','electrical/control safety','tolerance/backlash stack','vibration/modal/input shaping','physical build qualification'}
          assert required.issubset(set(r['unqualified_domains']))
          assert pathlib.Path('build/fuse-c220-engineering/FUSE_C220_cybr_physics.manifest').is_file()
          print('FUSE_C220_ENGINEERING_GATE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuse-c220-engineering
          path: |
            build/fuse-c220-engineering/FUSE_C220_engineering_report.json
            build/fuse-c220-engineering/FUSE_C220_engineering_report.md
            build/fuse-c220-engineering/FUSE_C220_cybr_physics.manifest
            build/fuse-c220-engineering/FUSE_C220_engineering_calibration.gcode
            deliverables/FUSE_C220_mechanism_validation.json
            deliverables/FUSE_C220_hotend_validation.json
            deliverables/FUSE_C220_edge_validation.json
          if-no-files-found: warn
          retention-days: 30
