name: FUSE recovery verification
on:
  push:
    branches: ['sync/recent-chats-2026-09-14']
    paths: ['.github/workflows/fuse-recovery-ci.yml']
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export actual remote source inventory
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, zipfile
          def git(*args):
              return subprocess.check_output(['git', *args])
          out=pathlib.Path('source-inventory');out.mkdir()
          objects={}
          for row in git('cat-file','--batch-all-objects','--batch-check=%(objectname) %(objecttype) %(objectsize)').decode().splitlines():
              sha, kind, size=row.split()
              if kind=='blob':objects[sha]=int(size)
          (out/'git-blobs.json').write_text(json.dumps(objects,sort_keys=True))
          branches={}
          refs=git('for-each-ref','--format=%(refname:short)','refs/remotes/origin/').decode().splitlines()
          with zipfile.ZipFile(out/'recent-branch-source.zip','w',compression=zipfile.ZIP_DEFLATED) as archive:
              for ref in refs:
                  if ref=='origin/HEAD':continue
                  sha=git('rev-parse',ref).decode().strip()
                  tree={}
                  for item in git('ls-tree','-rz',ref).split(b'\0'):
                      if not item:continue
                      meta,path=item.decode().split('\t',1)
                      mode,kind,blob=meta.split()
                      if kind=='blob':tree[path]={'sha':blob,'mode':mode,'size':objects.get(blob)}
                  branches[ref.removeprefix('origin/')]={'sha':sha,'files':tree}
                  if ref=='origin/master' or 'reach' in ref or 'procedural-human-face' in ref:
                      for path,record in tree.items():
                          if pathlib.Path(path).suffix in ('.py','.cpp','.h','.hpp','.md','.json','.toml','.txt','.sh','.yml','.yaml'):
                              archive.writestr(ref.removeprefix('origin/').replace('/','__')+'/'+path,git('cat-file','blob',record['sha']))
          (out/'branch-trees.json').write_text(json.dumps(branches,sort_keys=True))
          print('Inventoried',len(branches),'remote branches and',len(objects),'existing source blobs')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recent-source-inventory
          path: source-inventory/
          retention-days: 30
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      PYTHONPATH: src
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/recent-chats-2026-09-14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tested.txt
      - name: Make validation CLIs fail closed and document the renderer migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('examples/fuse_c220/verify_mechanism.py');s=p.read_text()
          s=s.replace("out=Path('deliverables');a=build();r=verify(a);", "out=Path('deliverables');out.mkdir(parents=True,exist_ok=True);a=build();r=verify(a);")
          if "if not r['all_passed']:raise SystemExit(1)" not in s:
              s=s.replace(" save_cache(a,out/'cache');", " if not r['all_passed']:raise SystemExit(1)\n save_cache(a,out/'cache');")
          p.write_text(s)
          p=Path('examples/fuse_c220/toolpath.py');s=p.read_text()
          s=s.replace("p=Path(sys.argv[1]);tp=generate(p);p.with_suffix('.validation.json').write_text(json.dumps(verify(tp),indent=2));print(json.dumps(verify(tp),indent=2))", "p=Path(sys.argv[1]);p.parent.mkdir(parents=True,exist_ok=True);tp=generate(p);report=verify(tp);p.with_suffix('.validation.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))\n if not report['all_passed']:raise SystemExit(1)")
          p.write_text(s)
          p=Path('examples/fuse_c220/printer.py');s=p.read_text().replace("Geometry is built with CYBR GEO's OpenCascade/mesh part contracts. Native V9\nrendering is used unmodified.", "Geometry is built with CYBR GEO's OpenCascade/mesh part contracts. Shared V9\nrendering is selected by render_delivery.py.");p.write_text(s)
          p=Path('examples/fuse_c220/README.md');s=p.read_text()
          s=s.replace("An original Cartesian FFF printer designed with CYBR GEO, rendered with its native\nV9 path tracer, and exercised with a deterministic extrusion toolpath.\n\n![CYBR FUSE C220](../../media/fuse_c220/hero.jpg)", "An original Cartesian FFF printer designed with CYBR GEO and exercised with a\ndeterministic extrusion toolpath. The recovered recipe now uses the repository's\ncurrent Mitsuba/OIDN V9 renderer for new renders.\n\n**Recovery note (2026-09-14):** the original source is preserved in Git history.\nOriginal delivered images and video used the older native photographic renderer;\nthey are not evidence of a fresh Mitsuba V9 run. This publication restores source\nand numerical evidence, not the entire historical binary delivery. See\n[the recovery receipt](../../docs/publication_receipts/fuse-c220-chat-recovery-2026-09-14.json).")
          if 'Optional: set `CYBR_GEO_EMBREE_ROOT`' in s:
              a=s.index('Optional: set `CYBR_GEO_EMBREE_ROOT`');b=s.index('## Before a physical build')
              s=s[:a]+'''New stills call `mechanism_lab.v9_dispatch.render_v9`, with the current
          `V9.still_spp` and `V9.still_depth`; preview uses an explicit 32-spp budget.
          The main still resolutions remain 1920 x 1440 and 1920 x 1280. The renderer
          fetches its recorded workshop lighting/bench assets and OIDN runtime as described
          in [the shared V9 documentation](../../docs/RENDER_V9.md). No model is downloaded.

          The operation film traces each frame through the same V9 entrypoint, at 960 x 720,
          24 fps, `V9.video_spp`, and `V9.video_depth`. Frames are serialized because the
          shared generic dispatch temporarily changes renderer module globals. They are
          not submitted concurrently through that non-thread-safe dispatch. Renderer JSON,
          truth receipts and unfiltered PNGs accompany the frames. Explanatory text labels
          are burned into the final frames and disclosed in the video receipt.

          The first two seconds are a variable-speed 180-layer time-lapse. The next two
          seconds replay final extrusion at modeled real time. This is not a claim that a
          physical printer produces the vessel in two seconds. There is no frame interpolation.

          Current-V9 checkpoints live in `work/film_v9_frames`, separate from historical
          native frames. Source, cache and toolpath hashes invalidate changed checkpoints;
          encoding refuses missing or modified frames. `render_delivery.py frames 41`
          renders one selected frame; `render_delivery.py encode` requires all 96 valid
          frame receipts. Do not treat adapter wiring tests as evidence of a completed render.

          '''+s[b:]
          p.write_text(s)
          PY
      - name: Execute fresh CAD, kinematic, and renderer-contract regressions
        run: |
          mkdir -p docs/validation/fuse_c220
          python -m compileall -q examples/fuse_c220
          set -o pipefail
          python -m pytest -q tests/test_fuse_c220_recovery.py tests/test_v9_render_profile.py --junitxml=docs/validation/fuse_c220/recovery-2026-09-14.xml | tee docs/validation/fuse_c220/recovery-2026-09-14.log
          python - <<'PY'
          import datetime,hashlib,json,os,pathlib,subprocess,xml.etree.ElementTree as ET
          out=pathlib.Path('docs/validation/fuse_c220')
          suites=ET.parse(out/'recovery-2026-09-14.xml').getroot().findall('testsuite')
          counts={key:sum(int(s.attrib.get(key,0)) for s in suites) for key in ('tests','failures','errors','skipped')}
          if counts['failures'] or counts['errors']:raise RuntimeError(counts)
          record={'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'counts':counts,
                  'scope':'Fresh nominal CAD, ideal kinematics, toolpath, checkpoint integrity, and V9 adapter contract. Rendering calls in adapter tests are mocks; no new full printer render, thermal/strength analysis, controller execution, or physical printing is claimed.',
                  'run_url':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
                  'tested_parent':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('examples/fuse_c220').glob('*.py')}}
          (out/'recovery-2026-09-14.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Commit verified compatibility fixes and execution receipts
        run: |
          git config user.name 'CYBR GEO source recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- examples/fuse_c220 docs/validation/fuse_c220
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Verify recovered FUSE C220, fail closed on numerical errors, and clarify current V9 provenance'
          git push origin HEAD:sync/recent-chats-2026-09-14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuse-recovery-test-results
          path: docs/validation/fuse_c220/
          retention-days: 30
