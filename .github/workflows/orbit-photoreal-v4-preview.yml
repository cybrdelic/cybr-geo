name: ORBIT Photoreal V4 Preview

on:
  push:
    branches: [feat/orbit-photoreal-v4-preview]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ffmpeg libgl1 libegl1
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-orbit-v3-tested.txt
          python -m pip install --no-deps -e .
      - name: Render v4 hero proof
        run: |
          python tools/orbit_photoreal_v4.py \
            --out /tmp/orbit-v4-preview \
            --size 800x600 \
            --deliver-size 800x600 \
            --spp 64 \
            --depth 14 \
            --threads 4 \
            --views hero
      - uses: actions/upload-artifact@v4
        with:
          name: ORBIT-photoreal-v4-preview
          path: /tmp/orbit-v4-preview/
          if-no-files-found: error
          retention-days: 7
