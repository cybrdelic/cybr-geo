name: Engineering portability

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    name: Engineering on ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: macos-15
            arch: arm64
    env:
      PYTHONPATH: src
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned platform wheels and capture dependency evidence
        shell: python
        run: |
          import importlib.metadata, json, pathlib, platform, subprocess, sys
          output = pathlib.Path('outputs/portable-smoke')
          output.mkdir(parents=True, exist_ok=True)
          commands = [
              [sys.executable, '-m', 'pip', 'install', '--only-binary=:all:', '-r', 'requirements-tested.txt',
               '--report', str(output / 'dependencies-install.json')],
              [sys.executable, '-m', 'pip', 'install', '--no-deps', '--no-build-isolation', '-e', '.'],
              [sys.executable, '-m', 'pip', 'check'],
          ]
          with (output / 'dependencies.log').open('w', encoding='utf-8') as log:
              for command in commands:
                  log.write(' '.join(command) + '\n'); log.flush()
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
                  if result.returncode:
                      print((output / 'dependencies.log').read_text(encoding='utf-8'))
                      sys.exit(result.returncode)
          packages = ['numpy', 'cadquery', 'cadquery-ocp', 'vtk', 'mujoco', 'numba', 'llvmlite', 'pytest']
          evidence = dict(system=platform.system(), machine=platform.machine(), python=sys.version,
                          versions={name: importlib.metadata.version(name) for name in packages},
                          node=subprocess.check_output(['node', '--version'], text=True).strip(),
                          scope='Installed dependencies; actual CAD, dynamics and graphics are checked next.')
          (output / 'platform.json').write_text(json.dumps(evidence, indent=2), encoding='utf-8')
          print(json.dumps(evidence, indent=2))
      - name: Exercise native CAD, source controller, contact dynamics and installed examples
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile, xml.etree.ElementTree as ET
          output = pathlib.Path('outputs/portable-smoke')
          # The short temporary base avoids Windows legacy path-length limits
          # during the real nested-wheel installation test.
          with tempfile.TemporaryDirectory(prefix='geo-ci-') as temporary:
              command = [sys.executable, '-m', 'pytest', '-q', '--durations=15',
                         '--basetemp', str(pathlib.Path(temporary) / 'tests'),
                         '--junitxml', str(output / 'tests.xml'),
                         'tests/test_actuation.py', 'tests/test_contact_geometry.py',
                         'tests/test_native_construction.py', 'tests/test_shape_dag.py',
                         'tests/test_causal_runtime.py', 'tests/test_causal_counterfactual.py',
                         'tests/test_physical_model.py',
                         'tests/test_physical_replay.py', 'tests/test_engineering_distribution.py',
                         'tests/test_preview.py']
              command += sorted(str(path) for path in pathlib.Path('studio/tests').glob('test_*.py'))
              with (output / 'tests.log').open('w', encoding='utf-8') as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=720)
              print((output / 'tests.log').read_text(encoding='utf-8'))
              if not result.returncode:
                  suites = ET.parse(output / 'tests.xml').getroot().iter('testsuite')
                  assert sum(int(suite.get('skipped', '0')) for suite in suites) == 0, 'Required platform tests were skipped'
              sys.exit(result.returncode)
      - name: Run and verify the public PBR preview command
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          from PIL import Image, ImageStat
          output = pathlib.Path('outputs/portable-smoke/preview')
          output.mkdir(parents=True, exist_ok=True)
          command = [sys.executable, '-m', 'mechanism_lab', 'preview', 'example_flange',
                     '--renderer', 'pbr', '--step', '--size', '320x240', '--out', str(output)]
          with (output / 'command.log').open('w', encoding='utf-8') as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=180)
          print((output / 'command.log').read_text(encoding='utf-8'))
          if result.returncode:
              sys.exit(result.returncode)
          report = json.loads((output / 'preview.json').read_text())
          render = json.loads((output / 'hero.render.json').read_text())
          assert report['passed'] and report['backend'] == 'vtk-pbr', report
          assert render['render_window'] and render['graphics_capabilities'], render
          assert (output / 'example_flange.step').read_text().startswith('ISO-10303-21')
          assert (output / 'example_flange.glb').stat().st_size > 100
          with Image.open(output / 'hero.png').convert('RGB') as image:
              assert image.size == (320, 240)
              assert max(ImageStat.Stat(image).var) > 1, 'Uniform/blank graphics output'
          print(json.dumps(report, indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-${{ matrix.os }}-${{ matrix.arch }}
          path: outputs/portable-smoke/
          if-no-files-found: error
          retention-days: 30
