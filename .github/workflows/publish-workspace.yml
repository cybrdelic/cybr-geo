name: Publish verified workspace
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/publish-workspace.yml']
permissions:
  contents: write
concurrency:
  group: cybr-geo-publication-v2
  cancel-in-progress: false
jobs:
  receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Make ephemeral receiver public key
        run: |
          mkdir -p /tmp/public-key
          python - <<'PY'
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          from pathlib import Path
          import os
          key=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          Path('/tmp/publication-private.pem').write_bytes(key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          Path('/tmp/public-key/receiver.pem').write_bytes(key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))
          Path('/tmp/public-key/run_id.txt').write_text(os.environ['GITHUB_RUN_ID'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: publication-receiver-public-key
          path: /tmp/public-key/
          retention-days: 1
      - name: Receive encrypted manifests and publish verified files
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,os,pathlib,stat,struct,subprocess,time,urllib.request,urllib.parse,zipfile,zlib
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          P=pathlib.Path
          run=os.environ['GITHUB_RUN_ID']
          key=serialization.load_pem_private_key(P('/tmp/publication-private.pem').read_bytes(),None)
          done=set();failures={};start=time.monotonic()
          def git(*a,check=True):return subprocess.run(['git',*a],check=check,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          git('config','user.name','CYBR GEO publication');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          while time.monotonic()-start<3000:
            git('pull','--rebase','origin','master',check=False)
            for manifest in sorted(P('.publication2/queue').glob('*.json')):
              if manifest.name in done:continue
              try:
                envelope=json.loads(manifest.read_text())
                if str(envelope['run_id'])!=run:continue
                decode=lambda k:base64.b64decode(envelope[k])
                aes=key.decrypt(decode('encrypted_key'),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
                payload=json.loads(AESGCM(aes).decrypt(decode('nonce'),decode('ciphertext'),run.encode()))
                url=payload['url'];u=urllib.parse.urlsplit(url)
                if u.scheme!='https' or not (u.hostname.endswith('.oaiusercontent.com') or u.hostname.endswith('.googleusercontent.com')):raise ValueError('unsupported transport host')
                with urllib.request.urlopen(url,timeout=180) as response:data=response.read(100*1024*1024+1)
                if len(data)>100*1024*1024:raise ValueError('transport size')
                if hashlib.sha256(data).hexdigest()!=payload['transport_sha256']:raise ValueError('transport hash')
                if payload.get('format')=='png-archive-v1':
                  if data[:8]!=b'\x89PNG\r\n\x1a\n':raise ValueError('PNG signature')
                  pos=8;chunks=[]
                  while pos+12<=len(data):
                    n=struct.unpack('>I',data[pos:pos+4])[0];kind=data[pos+4:pos+8];chunk=data[pos+8:pos+8+n]
                    if pos+12+n>len(data):raise ValueError('PNG truncation')
                    if zlib.crc32(kind+chunk)&0xffffffff!=struct.unpack('>I',data[pos+8+n:pos+12+n])[0]:raise ValueError('PNG CRC')
                    if kind==b'cgAr':chunks.append(chunk)
                    pos+=n+12
                  data=b''.join(chunks)
                if hashlib.sha256(data).hexdigest()!=payload['archive_sha256']:raise ValueError('archive hash')
                with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  entries=archive.infolist();total=0;count=0
                  for info in entries:
                    p=P(info.filename)
                    if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] in {'.git','.github','.publication','.publication2'}:raise ValueError('unsafe path')
                    if stat.S_ISLNK(info.external_attr>>16):raise ValueError('symlink')
                    total+=info.file_size
                    if info.file_size>=100*1024*1024 or total>1500*1024*1024:raise ValueError('archive size')
                  for info in entries:
                    if info.is_dir():continue
                    p=P(info.filename);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(archive.read(info));count+=1
                receipt=P('docs/publication_receipts')/(manifest.stem+'.json');receipt.parent.mkdir(parents=True,exist_ok=True)
                receipt.write_text(json.dumps({'run_id':run,'archive_sha256':payload['archive_sha256'],'files':count,'bytes':total,'transport_sha256':payload['transport_sha256']},indent=2))
                git('add','.');git('commit','-m','Publish verified workspace payload '+manifest.stem)
                for attempt in range(10):
                  if git('push','origin','HEAD:master',check=False).returncode==0:break
                  git('pull','--rebase','origin','master');time.sleep(2)
                else:raise RuntimeError('push retries exhausted')
                done.add(manifest.name);print('Published',manifest.name,count,'files',flush=True)
              except Exception as exc:
                failures[manifest.name]=type(exc).__name__;print('Retry',manifest.name,type(exc).__name__,flush=True)
            finish=P('.publication2/finish.json')
            if finish.exists():
              end=json.loads(finish.read_text())
              if str(end.get('run_id'))==run and len(done)>=int(end.get('expected_transfers',9999)):
                print('COMPLETE',len(done),'verified payloads',flush=True);break
            time.sleep(8)
          else:raise RuntimeError('Timed out before all publication payloads arrived')
          PY
