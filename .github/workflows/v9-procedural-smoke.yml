name: V9 procedural mesh smoke

on:
  push:
    branches: ['fix/true-v9-mitsuba-default']
    paths:
      - '.github/workflows/v9-procedural-smoke.yml'
      - 'src/mechanism_lab/v9_dispatch.py'
  pull_request:
    paths:
      - '.github/workflows/v9-procedural-smoke.yml'
      - 'src/mechanism_lab/v9_dispatch.py'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mitsuba 3.7.1
        run: python -m pip install 'mitsuba==3.7.1'
      - name: Probe procedural mesh construction modes in isolated processes
        shell: bash --noprofile --norc {0}
        run: |
          cat >/tmp/probe_mesh.py <<'PY'
          import gc,sys
          import mitsuba as mi
          import drjit as dr
          mi.set_variant('llvm_ad_rgb')
          mode=sys.argv[1]
          diffuse={'type':'diffuse','reflectance':{'type':'rgb','value':[.5,.5,.5]}}
          principled={'type':'principled','base_color':{'type':'rgb','value':[.49,.505,.52]},'metallic':1.0,'roughness':.25,'anisotropic':.155,'clearcoat':.01,'clearcoat_gloss':.8,'specular':.47}

          def make_mesh(local_lifetime=False):
              p=mi.Point3f(mi.Float([-1,1,0]),mi.Float([0,0,0]),mi.Float([0,0,1]))
              n=mi.Normal3f(mi.Float([0,0,0]),mi.Float([1,1,1]),mi.Float([0,0,0]))
              f=mi.Vector3u(mi.UInt32([0]),mi.UInt32([1]),mi.UInt32([2]))
              props=mi.Properties(); bsdf=None
              if mode in ('props_bsdf','props_bsdf_normals'):
                  bsdf=mi.load_dict(diffuse); props['bsdf']=bsdf
              if mode in ('principled','principled_aov','principled_aov_bench','lifetime'):
                  bsdf=mi.load_dict(principled); props['bsdf']=bsdf
              have_normals=mode not in ('docs','props_bsdf')
              mesh=mi.Mesh('tri',3,1,props,have_normals,False)
              params=mi.traverse(mesh)
              params['vertex_positions']=dr.ravel(p); params['faces']=dr.ravel(f)
              if have_normals: params['vertex_normals']=dr.ravel(n)
              params.update()
              if mode=='set_bsdf':
                  bsdf=mi.load_dict(diffuse); mesh.set_bsdf(bsdf)
              if local_lifetime:
                  return mesh
              return mesh,(p,n,f,params,bsdf)

          if mode=='lifetime':
              mesh=make_mesh(True)
              gc.collect(); dr.sync_thread()
              keepalive=None
          else:
              mesh,keepalive=make_mesh(False)
          integrator={'type':'path'}
          if mode in ('principled_aov','principled_aov_bench','lifetime'):
              integrator={'type':'aov','aovs':'albedo:albedo,normal:sh_normal','beauty':{'type':'path','max_depth':14,'rr_depth':5}}
          scene_dict={
              'type':'scene','integrator':integrator,
              'light':{'type':'constant','radiance':1.0},
              'sensor':{
                  'type':'thinlens' if mode in ('principled_aov','principled_aov_bench','lifetime') else 'perspective',
                  'to_world':mi.ScalarTransform4f.look_at(origin=[0,-4,1],target=[0,0,.3],up=[0,0,1]),
                  'film':{'type':'hdrfilm','width':8,'height':8,'component_format':'float32'},
                  'sampler':{'type':'independent','sample_count':1},
              },
              'tri':mesh,
          }
          if mode in ('principled_aov','principled_aov_bench','lifetime'):
              scene_dict['sensor']['focus_distance']=4.0; scene_dict['sensor']['aperture_radius']=.02
          if mode=='principled_aov_bench':
              scene_dict['bench']={'type':'rectangle','to_world':mi.ScalarTransform4f.translate([0,0,-.1]) @ mi.ScalarTransform4f.scale([3,3,1]),'bsdf':{'type':'principled','base_color':{'type':'rgb','value':[.105,.1,.094]},'metallic':0.0,'roughness':.5,'specular':.34,'clearcoat':0.0}}
          print('PRELOAD',mode,mesh,flush=True)
          scene=mi.load_dict(scene_dict)
          print('LOADED',mode,flush=True)
          image=mi.render(scene,spp=1); dr.eval(image)
          print('RENDERED',mode,dr.width(image),flush=True)
          PY
          : >/tmp/results.txt
          for mode in docs normals props_bsdf props_bsdf_normals set_bsdf principled principled_aov principled_aov_bench lifetime; do
            echo "=== $mode ==="
            python /tmp/probe_mesh.py "$mode"
            code=$?
            echo "$mode $code" | tee -a /tmp/results.txt
          done
          echo '=== RESULTS ==='; cat /tmp/results.txt
          grep -q '^docs 0$' /tmp/results.txt
