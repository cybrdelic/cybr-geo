name: True V9 + AERIS integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/v9-aeris.yml'
      - 'examples/aeris/**'
      - 'src/mechanism_lab/v9.py'
      - 'src/mechanism_lab/render_profiles.py'
      - 'src/mechanism_lab/cli.py'
      - 'src/cybrgeo/**'
      - 'tests/test_v9_render_profile.py'
      - 'tests/test_shared_photo_pipeline.py'
      - 'docs/RENDER_V9.md'
      - 'pyproject.toml'
      - 'requirements-tested.txt'
  push:
    branches: ['fix/true-v9-mitsuba-default']
    paths:
      - '.github/workflows/v9-aeris.yml'
      - 'examples/aeris/**'
      - 'src/mechanism_lab/v9.py'
      - 'src/mechanism_lab/render_profiles.py'
      - 'src/mechanism_lab/cli.py'
      - 'src/cybrgeo/**'
      - 'tests/test_v9_render_profile.py'
      - 'tests/test_shared_photo_pipeline.py'
      - 'docs/RENDER_V9.md'
      - 'pyproject.toml'
      - 'requirements-tested.txt'

concurrency:
  group: true-v9-aeris-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CAD, EGL and rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 libglu1-mesa ffmpeg cmake g++ libcairo2 curl
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tested.txt
          python -m pip install --no-deps -e .
      - name: Compile Python sources
        run: python -m compileall -q src examples/aeris
      - name: Gate the actual V9 defaults
        run: python -m pytest -q tests/test_v9_render_profile.py tests/test_shared_photo_pipeline.py
      - name: Check shared core regression tests
        run: python -m pytest -q tests/test_core.py
      - name: Build complete AERIS analytic and mesh assemblies
        run: python examples/aeris/build_assets.py --out build/aeris --exports
      - name: Verify geometry, CAD contacts and serialized animation
        run: python examples/aeris/verify.py --out build/aeris --cad
      - name: Render AERIS through exact-quality V9
        run: |
          python examples/aeris/render_assets.py --out build/aeris --views hero \
            --size 1100x825 --spp 256 --depth 14 --threads 2
      - name: Verify V9 render provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          root=Path('build/aeris/renders')
          final=root/'aeris_hero.png';noisy=root/'aeris_hero_noisy.png'
          meta=json.loads((root/'aeris_hero.json').read_text())
          for p in (final,noisy):
              with Image.open(p) as im:
                  im.verify();assert im.size==(1100,825)
          with Image.open(final).convert('RGB') as a,Image.open(noisy).convert('RGB') as b:
              assert sum(ImageStat.Stat(ImageChops.difference(a,b)).mean)>.10
          assert meta['render_profile']=='v9'
          assert meta['backend']=='v9-mitsuba-hdri-oidn'
          assert meta['renderer']=='Mitsuba 3 path + albedo/normal-guided Intel OIDN'
          assert meta['generated_imagery'] is False
          assert meta['environment']['asset']=='small_workshop'
          assert meta['environment']['license']=='CC0'
          assert meta['bench_surface']['asset']=='blue_metal_plate'
          assert meta['bench_surface']['license']=='CC0'
          assert meta['resolution']==[1100,825] and meta['spp']==256 and meta['max_depth']==14
          PY
      - name: Generate analytic whiteprints
        run: python examples/aeris/draw_assets.py --out build/aeris
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: true-v9-aeris-verification
          path: |
            build/aeris/validation.json
            build/aeris/verification.json
            build/aeris/*.coverage.json
            build/aeris/*.animation.json
            build/aeris/renders/
            build/aeris/whiteprints/
            build/aeris/*.glb
            build/aeris/*.step
          if-no-files-found: error
          retention-days: 30
