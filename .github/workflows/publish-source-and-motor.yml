name: Publish source and reproduce motor
on:
  workflow_dispatch:
  push:
    paths: ['.publication_native/ready.json']
permissions:
  contents: write
concurrency:
  group: cybr-geo-source-publication
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Verify and unpack source archive
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,lzma,pathlib,tarfile
          P=pathlib.Path
          root=P('.publication_native')
          meta=json.loads((root/'ready.json').read_text())
          pieces=[]
          for entry in meta['chunks']:
            text=(root/entry['name']).read_bytes()
            digest=hashlib.sha1(('blob '+str(len(text))+'\0').encode()+text).hexdigest()
            assert digest==entry['git_blob'], 'Source transport chunk mismatch: '+entry['name']
            pieces.append(text)
          data=base64.b64decode(b''.join(pieces),validate=True)
          assert hashlib.sha256(data).hexdigest()==meta['archive_sha256'], 'Source archive checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(data))) as archive:
            entries=archive.getmembers()
            assert len(entries)==meta['files']
            for entry in entries:
              path=P(entry.name)
              assert entry.isfile() and not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] not in {'.git','.github','.publication_native','.publication','.publication2'}
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(archive.extractfile(entry).read())
          P('docs').mkdir(exist_ok=True)
          P('docs/source_publication.json').write_text(json.dumps({'archive_sha256':meta['archive_sha256'],'files':meta['files'],'scope':'Software, model source, documentation and README previews. Original large differential binary assets are not implied by this source receipt.'},indent=2))
          PY
          python -m compileall -q src tools tests examples/template_part.py
      - name: Commit source and remove temporary transport files
        id: commit
        run: |
          git config user.name 'CYBR GEO publication'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .publication_native .publication .publication2
          git rm --ignore-unmatch .github/workflows/receive-publication.yml .github/workflows/publish-workspace.yml
          git add .
          git commit -m 'Publish reusable geometry toolkit, retained model source and README previews'
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  motor:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LP_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tested rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg g++ libegl1 libgl1 libopengl0 libxrender1 libxext6 libcairo2
          python -m pip install -r requirements-tested.txt
          python -m pip install --no-deps -e .
          python -m pytest -q
      - name: Reproduce documented motor geometry and media
        run: |
          python tools/fetch_references.py
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('references/neo_vortex')
          for name,entry in json.loads((root/'pinned_sources.json').read_text()).items():
            data=(root/name).read_bytes()
            assert len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256'], 'Manufacturer reference changed: '+name
          PY
          python tools/import_motor.py
          python -c 'from tools.build_motor_study import prepare_motor; prepare_motor()'
          python tools/render_motor_study.py --motor-only
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil,json,hashlib
          root=Path('examples/neo_vortex')
          shutil.copy2(root/'videos/motor_inspection.gif','media/motor_preview.gif')
          for source,target in [('renders/hero_pathtraced.png','motor_hero.jpg'),('drawings/motor_envelope.png','whiteprint_preview.jpg')]:
            im=Image.open(root/source).convert('RGB');im.thumbnail((1400,1000));im.save(Path('media')/target,quality=90)
          receipt={str(p):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.rglob('*') if p.is_file() and '.cache' not in p.parts and '__pycache__' not in p.parts}
          Path('docs/motor_publication.json').write_text(json.dumps({'scope':'Reproduced vendor mechanical model and newly rendered motor study. Does not assert upload of the original differential binary assets.','files':receipt},indent=2))
          PY
      - name: Publish motor geometry, images, drawings and actual-motion GIF
        run: |
          git config user.name 'CYBR GEO publication'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/neo_vortex references/neo_vortex media docs/motor_publication.json
          git commit -m 'Publish source-verified NEO Vortex mechanical CAD, inspection film and whiteprints'
          git pull --rebase origin master
          git push origin HEAD:master
