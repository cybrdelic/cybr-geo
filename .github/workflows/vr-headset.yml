name: CYBR VISOR M1 CAD and V9 renders
on:
  push:
    branches: ['feat/cybr-visor-m1']
    paths:
      - 'examples/vr_headset/**'
      - 'tests/test_vr_headset.py'
      - 'src/mechanism_lab/core.py'
      - 'src/mechanism_lab/v9.py'
      - '.github/workflows/vr-headset.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visor-m1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-render:
    strategy:
      fail-fast: false
      matrix:
        segment: [-1, 0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYOPENGL_PLATFORM: egl
      OMP_NUM_THREADS: '2'
      DRJIT_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CAD and renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 libglu1-mesa ffmpeg cmake g++ libcairo2 fonts-dejavu-core
          python -m pip install -r requirements-tested.txt
          python -m pip install --no-deps -e .
      - name: Verify optical mathematics and renderer compatibility
        run: |
          python -m compileall -q examples/vr_headset
          python -m pytest -q tests/test_vr_headset.py tests/test_core.py tests/test_v9_render_profile.py tests/test_shared_photo_pipeline.py
      - name: Build and verify analytic CAD, travel and service paths
        run: python examples/vr_headset/build_assets.py --out build/vr_headset
      - name: Execute the stereo viewer in Chromium
        if: matrix.segment == -1
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python examples/vr_headset/verify_viewer.py
      - name: Render V9 stills
        if: matrix.segment == -1
        run: python examples/vr_headset/render_assets.py --views hero eyes exploded optics --spp 256
      - name: Render disjoint V9 motion segment
        if: matrix.segment != -1
        env:
          SEGMENT: ${{ matrix.segment }}
        run: python examples/vr_headset/render_assets.py --segment-index "$SEGMENT"
      - name: Publish verified stills and CAD
        if: matrix.segment == -1 && github.ref == 'refs/heads/feat/cybr-visor-m1'
        run: |
          python examples/vr_headset/publish_results.py
          git fetch origin feat/cybr-visor-m1
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/vr_headset docs/validation/vr_headset
          git commit -m "Publish corrected VISOR M1 CAD and V9 stills [skip ci]"
          git push origin HEAD:refs/heads/feat/cybr-visor-m1
      - uses: actions/upload-artifact@v4
        if: always() && matrix.segment == -1
        with:
          name: visor-m1-stills-cad
          path: |
            build/vr_headset/renders/
            build/vr_headset/*.json
            build/vr_headset/*.step
            build/vr_headset/*.glb
            build/vr_headset/print_parts/
            build/vr_headset/bom/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && matrix.segment != -1
        with:
          name: visor-m1-segment-${{ matrix.segment }}
          path: build/vr_headset/renders/visor_ipd_segment_*
          if-no-files-found: error
          retention-days: 30

  assemble-publish:
    needs: verify-render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cybr-visor-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: visor-m1-stills-cad
          path: build/vr_headset
      - uses: actions/download-artifact@v4
        with:
          pattern: visor-m1-segment-*
          merge-multiple: true
          path: build/vr_headset/renders
      - name: Join segments and verify every decoded frame
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python examples/vr_headset/assemble_video.py
      - name: Publish final motion and execution receipt
        if: github.ref == 'refs/heads/feat/cybr-visor-m1'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          receipt=json.loads(Path('docs/validation/vr_headset/receipt.json').read_text())
          assert receipt['source_commit']==os.environ['GITHUB_SHA']
          PY
          python examples/vr_headset/publish_results.py
          git fetch origin feat/cybr-visor-m1
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/vr_headset docs/validation/vr_headset
          git commit -m "Publish verified 96-frame V9 VISOR M1 motion proof [skip ci]"
          git push origin HEAD:refs/heads/feat/cybr-visor-m1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visor-m1-complete-delivery
          path: build/vr_headset
          if-no-files-found: error
          retention-days: 30
