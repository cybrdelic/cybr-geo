name: CYBR VISOR M1 CAD and V9 renders
on:
  push:
    branches: ['feat/cybr-visor-m1']
    paths:
      - 'examples/vr_headset/**'
      - 'tests/test_vr_headset.py'
      - 'src/mechanism_lab/core.py'
      - 'src/mechanism_lab/v9.py'
      - '.github/workflows/vr-headset.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visor-m1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-render:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYOPENGL_PLATFORM: egl
      OMP_NUM_THREADS: '2'
      DRJIT_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CAD, renderer and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 libglu1-mesa ffmpeg cmake g++ libcairo2 fonts-dejavu-core
          python -m pip install -r requirements-tested.txt
          python -m pip install --no-deps -e .
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify optical mathematics and renderer compatibility
        run: |
          python -m compileall -q examples/vr_headset
          python -m pytest -q tests/test_vr_headset.py tests/test_core.py tests/test_v9_render_profile.py tests/test_shared_photo_pipeline.py
      - name: Build and verify analytic CAD, travel and service paths
        run: python examples/vr_headset/build_assets.py --out build/vr_headset
      - name: Execute the stereo viewer in Chromium
        run: python examples/vr_headset/verify_viewer.py
      - name: Render three real V9 stills
        run: python examples/vr_headset/render_assets.py --views hero eyes exploded --spp 256
      - name: Publish verified stills and CAD to the task branch
        if: github.ref == 'refs/heads/feat/cybr-visor-m1'
        run: |
          python examples/vr_headset/publish_results.py
          git fetch origin feat/cybr-visor-m1
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/vr_headset docs/validation/vr_headset
          git commit -m "Publish verified VISOR M1 CAD, stereo proof and V9 renders [skip ci]"
          git push origin HEAD:refs/heads/feat/cybr-visor-m1
      - name: Render every IPD motion frame through V9
        run: python examples/vr_headset/render_assets.py --views optics --video --spp 256
      - name: Publish independently rendered motion proof
        if: github.ref == 'refs/heads/feat/cybr-visor-m1'
        run: |
          python examples/vr_headset/publish_results.py
          git fetch origin feat/cybr-visor-m1
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git add media/vr_headset docs/validation/vr_headset
          git commit -m "Publish V9 VISOR M1 IPD motion proof [skip ci]"
          git push origin HEAD:refs/heads/feat/cybr-visor-m1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cybr-visor-m1-results
          path: |
            build/vr_headset/renders/
            build/vr_headset/*.json
            build/vr_headset/*.step
            build/vr_headset/*.glb
            build/vr_headset/print_parts/
            build/vr_headset/bom/
          if-no-files-found: error
          retention-days: 30
