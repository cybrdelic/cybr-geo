name: Consolidate recent CYBR GEO source
on:
  push:
    branches: ['sync/recent-chats-2026-09-14']
    paths: ['.github/workflows/consolidate-recent-source.yml']
permissions:
  contents: write
concurrency:
  group: consolidate-recent-cybr-source
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/recent-chats-2026-09-14
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve exact pinned source and integrate additive forearm recipes
        run: |
          python - <<'PY'
          import datetime,hashlib,json,pathlib,subprocess
          def git(*args):return subprocess.check_output(['git',*args])
          sources={
              'reach2-v5':('feat/reach2-orbit-integrated-v5','e05db8a533c402e98f0a6023c1cb6100c2a35794'),
              'procedural-face-v9':('feat/procedural-human-face-v9','c08d0132570c0fa8f6dcfa720a450fae1413a173'),
              'cybr-yard':('feat/diy-skatepark-v1','248d60500da08a648a3ab4f9e29cfd77a2aa11d5')}
          report={'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sources':{},'integrated_forearm_files':[],
                  'scope':'Exact pinned remote source snapshots and additive forearm integration. Shared src, native renderer, registry, and existing files are not overwritten. Feature branch tips are not modified. Historical qualification language is not physical certification.'}
          for slug,(branch,sha) in sources.items():
              subprocess.run(['git','fetch','origin',sha],check=True)
              if git('rev-parse',sha).decode().strip()!=sha:raise RuntimeError('wrong source commit')
              records=[]
              for item in git('ls-tree','-rz',sha).split(b'\0'):
                  if not item:continue
                  meta,name=item.decode().split('\t',1);mode,kind,blob=meta.split()
                  p=pathlib.PurePosixPath(name)
                  if kind!='blob' or mode not in ('100644','100755'):continue
                  if p.suffix.lower() not in ('.py','.cpp','.c','.h','.hpp','.md','.txt','.json','.toml','.yml','.yaml','.sh','.cmake') and p.name not in ('LICENSE','COPYING','.gitignore','CMakeLists.txt'):continue
                  if any(part in ('.source_import','.recovery','__pycache__') for part in p.parts):continue
                  content=git('cat-file','blob',blob)
                  if len(content)>1000000:continue
                  target=pathlib.Path('archive/published_branches/2026-09-14')/slug/name
                  if target.exists() and target.read_bytes()!=content:raise RuntimeError('snapshot collision '+str(target))
                  target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(content)
                  record={'path':str(target),'source_path':name,'git_blob':blob,'bytes':len(content),'sha256':hashlib.sha256(content).hexdigest()}
                  records.append(record)
                  if slug=='reach2-v5' and (name.startswith('examples/reach') or name.startswith('tests/test_reach') or name.startswith('tools/reach') or name=='tools/export_reach2_v5_cad.py'):
                      dest=pathlib.Path(name)
                      if dest.exists() and dest.read_bytes()!=content:raise RuntimeError('Refusing to overwrite newer active file '+name)
                      dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(content)
                      report['integrated_forearm_files'].append({'path':name,'sha256':record['sha256'],'git_blob':blob})
              report['sources'][slug]={'branch':branch,'commit':sha,'files':records}
          out=pathlib.Path('docs/publication_receipts/recent-remote-source-consolidation-2026-09-14.json')
          out.parent.mkdir(parents=True,exist_ok=True);out.write_text(json.dumps(report,indent=2)+'\n')
          print('Integrated',len(report['integrated_forearm_files']),'forearm source files; pinned source snapshots:',{k:len(v['files']) for k,v in report['sources'].items()})
          PY
          python -m compileall -q examples tools tests archive/published_branches/2026-09-14
      - run: python -m pip install -r requirements-tested.txt
      - name: Verify current printer, V9 contracts, and newest forearm geometry
        run: |
          mkdir -p docs/validation/recent_source
          set -o pipefail
          python -m pytest -q tests/test_fuse_c220_recovery.py tests/test_v9_render_profile.py tests/test_reach2_orbit_integrated_v5.py --junitxml=docs/validation/recent_source/integration-2026-09-14.xml | tee docs/validation/recent_source/integration-2026-09-14.log
          python - <<'PY'
          import datetime,json,os,pathlib,xml.etree.ElementTree as ET
          p=pathlib.Path('docs/validation/recent_source')
          suites=ET.parse(p/'integration-2026-09-14.xml').getroot().findall('testsuite')
          counts={k:sum(int(s.attrib.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          if counts['failures'] or counts['errors']:raise RuntimeError(counts)
          record={'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'counts':counts,
                  'run_url':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
                  'scope':'Fresh printer nominal numerics, V9 adapter wiring, and REACH-2 v5 CAD/geometry regression tests on the current master-based framework. No fresh full render or physical qualification is claimed. Other archived branch snapshots were syntax-checked, not fully rerendered.'}
          (p/'integration-2026-09-14.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Commit and push the verified consolidated source
        run: |
          git config user.name 'CYBR GEO source recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- examples tools tests archive/published_branches docs/publication_receipts docs/validation/recent_source
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Consolidate REACH forearm source and preserve pinned procedural-face and skatepark snapshots'
          git push origin HEAD:sync/recent-chats-2026-09-14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recent-source-consolidation-results
          path: docs/validation/recent_source/
          retention-days: 30
