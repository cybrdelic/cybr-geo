name: FUSE C220 functional paths

on:
  push:
    branches: ['fix/fuse-c220-functional-paths']
    paths:
      - 'examples/fuse_c220/**'
      - 'tests/test_fuse_c220*'
      - '.github/workflows/fuse-functional-paths.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fuse-functional-paths-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src:examples/fuse_c220
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CAD and real V9 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 libglu1-mesa ffmpeg libcairo2
          python -m pip install -r requirements-tested.txt
          python -m pip install --no-deps -e .
      - name: Run printer, adversarial G-code, CAD passage and V9 contract regressions
        run: |
          mkdir -p deliverables work
          python -m compileall -q examples/fuse_c220 tests/test_fuse_c220_functional_paths.py
          set -o pipefail
          python -m pytest -q tests/test_fuse_c220_recovery.py tests/test_fuse_c220_functional_paths.py tests/test_v9_render_profile.py --junitxml=deliverables/tests.xml | tee deliverables/tests.log
      - name: Generate calibration toolpath and corrected CAD exports
        run: |
          python examples/fuse_c220/toolpath.py deliverables/FUSE_C220_calibration.gcode
          python examples/fuse_c220/verify_mechanism.py
          python examples/fuse_c220/verify_edges.py
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          import printer
          import verify_hotend
          out = pathlib.Path('deliverables')
          report = verify_hotend.verify(printer.build())
          (out / 'FUSE_C220_hotend_validation.json').write_text(json.dumps(report, indent=2))
          assert report['all_passed'], report
          record = {
              'tested_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'source_sha256': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('examples/fuse_c220').glob('*.py')},
              'scope': 'Fresh numerical and CAD checks. No physical printer, thermal or melt simulation, controller execution or manufacturing release.'
          }
          (out / 'execution.json').write_text(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuse-functional-validation
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/download-artifact@v4
        with:
          name: fuse-functional-v9-renders
          path: previous_v9
          run-id: 34850079331
          github-token: ${{ github.token }}
      - name: Reuse verified completed model stills and render corrected CAD section
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil
          previous=pathlib.Path('previous_v9')
          original=json.loads((previous/'execution.json').read_text())
          assert original['tested_commit']=='d913877447589414137ee97ec670ce2257ecf834'
          for name in ('printer.py','toolpath.py','render_delivery.py'):
              path='examples/fuse_c220/'+name
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==original['source_sha256'][path],path
          for view in ('hero','printing','drive'):
              stem='FUSE_C220_'+view
              report=json.loads((previous/(stem+'.json')).read_text())
              assert report['render_profile']=='v9' and report['generated_imagery'] is False
              assert report['spp']==256 and report['max_depth']==14
              for path in previous.glob(stem+'*'):
                  shutil.copy2(path,pathlib.Path('deliverables')/path.name)
          pathlib.Path('deliverables/model_stills_execution.json').write_text(json.dumps(original,indent=2))
          PY
          python examples/fuse_c220/inspect_hotend.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuse-functional-v9-renders
          path: |
            deliverables/*.png
            deliverables/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve validated render media on this printer branch
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          from PIL import Image
          source = pathlib.Path('deliverables')
          target = pathlib.Path('media/fuse_c220')
          target.mkdir(parents=True, exist_ok=True)
          for stem in ('hero', 'printing', 'drive', 'feed_section'):
              image = source / ('FUSE_C220_' + stem + '.png')
              receipt = image.with_suffix('.json')
              report = json.loads(receipt.read_text())
              assert report['render_profile'] == 'v9' and report['generated_imagery'] is False
              assert report['spp'] == 256 and report['max_depth'] == 14
              with Image.open(image) as im:
                  im.verify()
              with Image.open(image) as im:
                  im.convert('RGB').save(target / (stem + '.jpg'), quality=94, subsampling=0)
              shutil.copy2(image, target / (stem + '.png'))
              shutil.copy2(receipt, target / (stem + '.json'))
          for path in source.glob('*validation.json'):
              shutil.copy2(path, target / path.name)
          for name in ('tests.xml', 'tests.log', 'execution.json', 'model_stills_execution.json', 'FUSE_C220_calibration.gcode'):
              shutil.copy2(source / name, target / name)
          (target / 'README.md').write_text(
              '# FUSE C220 corrected hotend and G-code replay\n\n'
              'Images are fresh Mitsuba/OIDN V9 renders, 256 spp and depth 14. '
              'The feed-section image uses disclosed analytic CAD section cuts. '
              'JPEGs are display copies of the retained full-resolution PNGs.\n\n'
              'See execution.json for the exact tested source commit and run. '
              'This evidence does not establish physical printer operation, '
              'manufacturing fits, thermal performance or molten-polymer behavior.\n'
          )
          PY
          git config user.name 'CYBR GEO printer verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- media/fuse_c220
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve verified FUSE hotend correction renders and execution evidence'
          git push origin HEAD:fix/fuse-c220-functional-paths
