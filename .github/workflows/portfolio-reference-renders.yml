name: Portfolio reference renders
on:
  pull_request:
    paths:
      - 'src/mechanism_lab/models/portfolio_machine.py'
      - 'src/mechanism_lab/registry.py'
      - '.github/workflows/portfolio-reference-renders.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-reference-renders-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - recipe: portfolio_scenes
            view: internal
            size: 960x720
          - recipe: portfolio_geo
            view: hero
            size: 960x720
          - recipe: portfolio_light
            view: hero
            size: 960x720
          - recipe: portfolio_elements
            view: section
            size: 960x720
          - recipe: portfolio_materials
            view: hero
            size: 960x720
          - recipe: portfolio_forest
            view: internal
            size: 960x720
          - recipe: portfolio_machine
            view: wide
            size: 1280x720
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install CYBR GEO environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ cmake ffmpeg libcairo2 libegl1 libgl1 libopengl0 libglib2.0-0
          python -m pip install -r requirements-tested.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Build geometry
        run: |
          lab build ${{ matrix.recipe }}
      - name: Render geometry review
        run: |
          mkdir -p outputs/${{ matrix.recipe }}/review
          lab render ${{ matrix.recipe }} --view ${{ matrix.view }} --renderer pbr --size ${{ matrix.size }} --supersample 2 --intent concept --allow-estimates --out outputs/${{ matrix.recipe }}/review/hero.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ matrix.recipe }}
          path: outputs/${{ matrix.recipe }}/review/
          if-no-files-found: error
