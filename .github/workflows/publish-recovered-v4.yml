name: Publish recovered source and assets
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/publish-recovered-v4.yml']
permissions:
  contents: write
concurrency:
  group: recovered-publication-v4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Create ephemeral transport key
        run: |
          mkdir -p /tmp/recovery-key
          python - <<'PY'
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          from pathlib import Path
          import os
          key = rsa.generate_private_key(public_exponent=65537,key_size=3072)
          Path('/tmp/recovery-private.pem').write_bytes(key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          Path('/tmp/recovery-key/public.pem').write_bytes(key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))
          Path('/tmp/recovery-key/run_id.txt').write_text(os.environ['GITHUB_RUN_ID'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-public-key
          path: /tmp/recovery-key/
          retention-days: 1
      - name: Receive and publish verified archives
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,os,pathlib,shutil,stat,subprocess,time,urllib.request,urllib.parse,zipfile
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          P=pathlib.Path
          run=os.environ['GITHUB_RUN_ID']
          private=serialization.load_pem_private_key(P('/tmp/recovery-private.pem').read_bytes(),None)
          def git(*args,check=True):
            return subprocess.run(['git',*args],check=check,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          git('config','user.name','CYBR GEO publication')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          complete=set(); started=time.monotonic(); failures={}
          while time.monotonic()-started<2700:
            git('pull','--rebase','origin','master',check=False)
            for manifest in sorted(P('.recovery-v4').glob('*.json')):
              if manifest.name=='finish.json' or manifest.name in complete: continue
              try:
                env=json.loads(manifest.read_text())
                if str(env['run_id'])!=run: continue
                dec=lambda k:base64.b64decode(env[k])
                aes=private.decrypt(dec('key'),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
                payload=json.loads(AESGCM(aes).decrypt(dec('nonce'),dec('body'),run.encode()))
                url=payload['url']; parsed=urllib.parse.urlsplit(url)
                assert parsed.scheme=='https' and parsed.hostname.endswith('.oaiusercontent.com')
                with urllib.request.urlopen(url,timeout=240) as response:
                  data=response.read(600*1024*1024+1)
                assert len(data)<=600*1024*1024
                assert hashlib.sha256(data).hexdigest()==payload['sha256'],'Archive hash mismatch'
                with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  members=archive.infolist(); total=0
                  for member in members:
                    path=P(member.filename)
                    assert not path.is_absolute() and '..' not in path.parts and path.parts
                    assert path.parts[0] not in ('.git','.recovery-v4','.publication','.publication2','.publication_native')
                    assert not stat.S_ISLNK(member.external_attr>>16)
                    assert member.file_size<100*1024*1024
                    total+=member.file_size
                  assert total<1500*1024*1024
                  for member in members:
                    if member.is_dir():continue
                    path=P(member.filename);path.parent.mkdir(parents=True,exist_ok=True)
                    path.write_bytes(archive.read(member))
                receipt=P('docs/publication_receipts')/(manifest.stem+'.json')
                receipt.parent.mkdir(parents=True,exist_ok=True)
                receipt.write_text(json.dumps({'run_id':run,'archive_sha256':payload['sha256'],'files':len(members),'bytes':total},indent=2))
                git('add','--all')
                if git('diff','--cached','--quiet',check=False).returncode:
                  git('commit','-m','Publish recovered project '+manifest.stem)
                for attempt in range(8):
                  if git('push','origin','HEAD:master',check=False).returncode==0:break
                  git('pull','--rebase','origin','master');time.sleep(2)
                else:raise RuntimeError('Push conflict')
                complete.add(manifest.name)
                print('PUBLISHED',manifest.name,len(members),'files',total,'bytes',flush=True)
              except Exception as exc:
                status=getattr(exc,'code',None)
                print('TRANSFER_RETRY',manifest.name,type(exc).__name__,'status',status,flush=True)
                failures[manifest.name]=type(exc).__name__
            end=P('.recovery-v4/finish.json')
            if end.exists():
              finish=json.loads(end.read_text())
              if str(finish.get('run_id'))==run and len(complete)>=finish.get('expected_transfers',9999):
                for name in ('.publication','.publication2','.publication_native','.recovery-v4'):
                  shutil.rmtree(name,ignore_errors=True)
                for name in ('publish-workspace.yml','receive-publication.yml','publish-source-and-motor.yml','publish-recovered-v4.yml'):
                  (P('.github/workflows')/name).unlink(missing_ok=True)
                git('add','--all');git('commit','-m','Finish verified publication and remove failed transfer scaffolding')
                git('pull','--rebase','origin','master');git('push','origin','HEAD:master')
                print('COMPLETE',len(complete),'verified archive transfers',flush=True)
                break
            time.sleep(6)
          else:raise RuntimeError('Publication not completed before receiver timeout')
          PY
