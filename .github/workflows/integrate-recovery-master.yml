name: Prepare corrected recovery tree (not merge approval)
on:
  push:
    branches: ['sync/recent-chats-2026-09-14']
    paths: ['.github/workflows/integrate-recovery-master.yml']
permissions:
  contents: write
concurrency:
  group: recovery-master-integration
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_MASTER: 5a1790506983343ec07cebcb554e5a903c5d0c0a
      RECOVERY_BRANCH: sync/recent-chats-2026-09-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard branches and integrate unchanged master
        run: |
          set -euo pipefail
          git config user.name 'CYBR GEO integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master "$RECOVERY_BRANCH" test/recovery-merge-2026-09-14
          test "$(git rev-parse origin/master)" = "$EXPECTED_MASTER"
          test "$(git rev-parse origin/$RECOVERY_BRANCH)" = "$GITHUB_SHA"
          git merge --no-ff --no-edit "$EXPECTED_MASTER"
          git diff --exit-code "$EXPECTED_MASTER" -- src native pyproject.toml requirements-tested.txt
      - name: Verify originals, repair recipes, and replace one-off helpers with read-only CI
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.')
          receipt = json.loads((root/'docs/publication_receipts/recent-remote-source-consolidation-2026-09-14.json').read_text())
          count = 0
          for source in receipt['sources'].values():
              for entry in source['files']:
                  data = (root/entry['path']).read_bytes()
                  assert len(data) == entry['bytes']
                  assert hashlib.sha256(data).hexdigest() == entry['sha256'], entry['path']
                  assert data == subprocess.check_output(['git','cat-file','blob',entry['git_blob']]), entry['path']
                  count += 1
          for entry in receipt['integrated_forearm_files']:
              assert hashlib.sha256((root/entry['path']).read_bytes()).hexdigest() == entry['sha256'], entry['path']
          changes = []
          def patch(path, old, new):
              p = root/path
              data = p.read_bytes(); text = data.decode()
              assert text.count(old) == 1, path
              p.write_text(text.replace(old,new))
              changes.append({'path':path,'before_sha256':hashlib.sha256(data).hexdigest(),'after_sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          patch('examples/reach2_engineered_elbow.py',
                '    motor_adapter = box(72, 8, 72, (px, motor_face_y + 4.0, pz), 4.0)',
                '    # A 4 mm all-edge fillet collapses the 8 mm plate thickness in OCCT.\n    # Keep a 2 mm web between opposing fillets instead of a degenerate edge.\n    motor_adapter = box(72, 8, 72, (px, motor_face_y + 4.0, pz), 3.0)')
          patch('examples/reach_elbow_module_v2.py',
                '        rib = box(42.0, 4.0, 16.0, (-22.0, y, -14.0), 1.2)\n        # Taper the rib with a diagonal cut so it reads like a machined gusset.\n        cutter = cq.Workplane("XZ", origin=(0, y - 2.1, 0)).polyline([\n            (-45, -24), (4, -24), (4, -5), (-8, -5)\n        ]).close().extrude(4.2).val()\n        rib = rib.intersect(cutter)',
                '        # XZ workplanes extrude toward -Y. The original boolean mask was\n        # disjoint from the rib and produced an empty compound. Construct the\n        # intended manifold gusset directly, as in the retained v2_fixed recipe.\n        rib = (\n            cq.Workplane("XZ", origin=(0, y, 0))\n            .polyline([(-43.0, -22.0), (0.0, -22.0), (-8.0, -6.0), (-36.0, -6.0)])\n            .close()\n            .extrude(4.0)\n            .val()\n        )')
          patch('examples/differential/src/model.py',
                "    (ROOT/'validation'/'kinematic_checks.json').write_text(json.dumps(result,indent=2))",
                "    validation_path = ROOT / 'validation' / 'kinematic_checks.json'\n    validation_path.parent.mkdir(parents=True, exist_ok=True)\n    validation_path.write_text(json.dumps(result, indent=2))")
          patch('docs/REPRODUCE.md',
                "python -m pip install -e '.[dev]'\nlab doctor\npython -m pytest -q",
                "python -m pip install -e '.[dev]'\nlab doctor\n# Source-only checkout: retain complete original inputs, otherwise regenerate.\n# Regeneration is documented by a receipt; it is not binary archive recovery.\npython tools/rebuild_differential_inputs.py\npython -m pytest -q")
          parts = sorted((root/'.chat_recovery').glob('*'))
          assert [p.name for p in parts] == [f'source.part{i:02d}' for i in range(8)]
          removed = [{'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in parts]
          obsolete = ['consolidate-recent-source.yml','fuse-recovery-ci.yml','recent-chat-audit.yml','recover-fuse-c220.yml','recover-session-snapshots.yml','integrate-recovery-master.yml']
          subprocess.run(['git','rm','--',*[str(p) for p in parts],*[f'.github/workflows/{name}' for name in obsolete]],check=True)
          ci = subprocess.check_output(['git','show','29bac60ac419a67025d704898d052e1e8399b212:.github/workflows/recovery-regressions.yml'],text=True)
          ci = ci.replace("branches: [master, 'test/recovery-merge-2026-09-14']",'branches: [master]')
          ci = ci.replace('shard: [0, 1, 2, 3]','shard: [0, 1, 2, 3, 4, 5, 6, 7]').replace("SHARD_COUNT: '4'","SHARD_COUNT: '8'")
          ci = ci.replace('len(manifests) == 4','len(manifests) == 8').replace("list(range(4))","list(range(8))").replace("m['shard_count'] == 4","m['shard_count'] == 8").replace('len(reports) == 4','len(reports) == 8').replace("'shards': 4","'shards': 8")
          input_job = '''  inputs:
              name: Rebuild differential inputs from retained source
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              env:
                PYTHONPATH: src
                OPENBLAS_NUM_THREADS: '1'
                OMP_NUM_THREADS: '4'
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                    cache: pip
                    cache-dependency-path: requirements-tested.txt
                - name: Install and regenerate missing source-only inputs
                  run: |
                    set -euo pipefail
                    sudo apt-get update -qq
                    sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libopengl0 libglib2.0-0
                    python -m pip install -r requirements-tested.txt
                    python -m pip install --no-deps -e .
                    python -u tools/rebuild_differential_inputs.py
                - uses: actions/upload-artifact@v4
                  with:
                    name: regression-differential-inputs
                    path: |
                      assets/differential_v3/geometry/*.npz
                      assets/differential_v3/geometry/*.json
                    if-no-files-found: error
                    retention-days: 30
          '''
          ci = ci.replace('jobs:\n  regressions:\n','jobs:\n'+input_job+'  regressions:\n    needs: inputs\n')
          ci = ci.replace('    needs: regressions\n','    needs: [inputs, regressions]\n')
          ci = ci.replace('      - name: Compile active source and execute this test partition\n', '''      - uses: actions/download-artifact@v4
                  with:
                    name: regression-differential-inputs
                    path: assets/differential_v3/geometry
                - name: Compile active source and execute this test partition
          ''')
          ci = ci.replace('          import json, os, pathlib, subprocess, sys','          import hashlib, json, os, pathlib, subprocess, sys')
          ci = ci.replace("          (root / 'partition.json').write_text", "          geom = pathlib.Path('assets/differential_v3/geometry')\n          required = ['reference_parts.npz', 'kinematic_core_parts.npz', 'working_variant_parts.npz']\n          assert all((geom / name).is_file() for name in required)\n          manifest['input_sha256'] = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(geom.iterdir()) if p.suffix in ('.json', '.npz')}\n          origin = geom / 'regeneration_receipt.json'\n          manifest['input_origin'] = json.loads(origin.read_text())['origin'] if origin.is_file() else 'Existing complete input arrays retained.'\n          (root / 'partition.json').write_text")
          ci = ci.replace("          expected = manifests[0]['all_files']", "          assert all(m['input_sha256'] == manifests[0]['input_sha256'] for m in manifests)\n          expected = manifests[0]['all_files']")
          ci = ci.replace("'tested_tree': manifests[0]['tree'],", "'input_sha256': manifests[0]['input_sha256'], 'input_origin': manifests[0]['input_origin'],\n                    'tested_tree': manifests[0]['tree'],")
          (root/'.github/workflows/recovery-regressions.yml').write_text(ci)
          report = {'status':'Source preparation complete; full regression gate must pass before merge. Results are recorded on PR #11 and in the Recovery regression tests summary artifact.','master_base':os.environ['EXPECTED_MASTER'],'workflow_source_commit':os.environ['GITHUB_SHA'],'verified_original_snapshot_files':count,'verified_original_active_forearm_files':len(receipt['integrated_forearm_files']),'intentional_active_changes':changes,'removed_incomplete_transport':removed,'removed_one_off_workflows':obsolete,'original_sources_and_transport_preserved_at':'a7c4a7f1ab4da2c2ea532d849e8c9a55d1df2e33','unchanged_shared_paths':['src/','native/','pyproject.toml','requirements-tested.txt'],'initial_full_regression':{'run_id':34845358423,'passed':124,'failed':2,'errors':11,'skipped':2},'pending_source_packages':['CELL-01/AERIS','Hot Springs v4','clouds v4','BACKLOT-01','spectral quartz','Prismatic II'],'limits':['No new full renders.','No physical build certification.','Regenerated arrays are not claimed byte-identical to historical archives.']}
          (root/'docs/validation/recent_source/master-integration-sources-2026-09-14.json').write_text(json.dumps(report,indent=2)+'\n')
          sections = ['# Recent-chat integration — 2026-09-14',
          'Current master is preserved, including its shared renderer and CYBR YARD updates. This recovery does not replace active shared source with older archived copies.',
          '## Active recovered projects',
          'FUSE C220 printer: `examples/fuse_c220/`, with geometry, toolpaths, mechanism/edge validation, and the current shared V9 renderer adapter. REACH/REACH-2 forearm and elbow: `examples/reach*`, `tools/reach*`, the v5 CAD exporter, and associated tests. Both `reach2_orbit_integrated_v5.py` and its v5b variant are retained.',
          '## Original source and integration fixes',
          '588 archived source files under `archive/published_branches/2026-09-14/` and 35 active recovered forearm files were checked against their publication receipt before editing. Archived originals remain unchanged. Two active historical recipes are repaired: the 8 mm motor adapter uses a nondegenerate 3 mm fillet, and REACH-1 v2 constructs the same direct trapezoidal gussets as its retained v2_fixed recipe. The differential model now creates its validation output directory on a clean checkout. Exact before/after checksums and removed transport checksums are in `docs/validation/recent_source/master-integration-sources-2026-09-14.json`.',
          '## Regression and source-only reproduction',
          'Run `python tools/rebuild_differential_inputs.py` before the full test suite when differential arrays are absent. Existing complete arrays are retained; regenerated arrays carry their own receipt and are not represented as recovered historical bytes. The read-only `Recovery regression tests` workflow generates missing inputs once, checks identical input hashes in all eight test partitions, and verifies complete nonoverlapping coverage of every active and legacy Python test file. Initial failures, fixes, final results, and the merge head are recorded in PR #11. Skipped historical media/catalogue tests are not counted as passes.',
          '## Publication still incomplete',
          'CELL-01/AERIS, Hot Springs v4, clouds v4, BACKLOT-01, spectral quartz, and Prismatic II have not all been restored as ordinary GitHub source. The previous transfer stopped at 8 of 22 encoded parts. Its incomplete `.chat_recovery/source.part*` files and obsolete one-off recovery workflows are excluded from the active tree; history at `a7c4a7f1ab4da2c2ea532d849e8c9a55d1df2e33` retains the originals. The separately delivered `cybr-recent-chat-source-payload.zip` preserves the recovered source and printer preview/video. Large historical CAD and render deliveries are not claimed fully published.',
          'These checks establish source preservation, CAD/software regression behavior, and deterministic numerical checks—not physical printer operation, complete torque/thermal safety certification, or a fresh full render.']
          (root/'docs/RECENT_CHAT_RECOVERY.md').write_text('\n\n'.join(sections)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Publish prepared branch only, not master; require subsequent full regression gate
        run: |
          set -euo pipefail
          python -m compileall -q src examples tools tests tests_legacy
          git diff --exit-code "$EXPECTED_MASTER" -- src native pyproject.toml requirements-tested.txt
          git diff --check
          git add -- examples/reach2_engineered_elbow.py examples/reach_elbow_module_v2.py examples/differential/src/model.py docs/REPRODUCE.md docs/RECENT_CHAT_RECOVERY.md docs/validation/recent_source/master-integration-sources-2026-09-14.json .github/workflows/recovery-regressions.yml
          git commit -m 'Integrate master, repair recovered CAD recipes, and replace recovery transport with regression CI'
          git fetch origin master "$RECOVERY_BRANCH"
          test "$(git rev-parse origin/master)" = "$EXPECTED_MASTER"
          test "$(git rev-parse origin/$RECOVERY_BRANCH)" = "$GITHUB_SHA"
          git push origin "HEAD:$RECOVERY_BRANCH"
          git rev-parse HEAD
