[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cybr-geo"
version = "0.4.1"
description = "Reusable CAD, mesh, mechanical inspection, animation, and whiteprint workshop"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-2.0-only"
dependencies = ["numpy==2.3.5", "cadquery==2.8.0", "vtk==9.6.2", "trimesh==4.11.1", "shapely==2.1.2", "scipy>=1.16,<2", "Pillow==12.3.0", "numba==0.65.1", "ezdxf>=1.4,<2", "CairoSVG>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
test = ["pytest>=8,<10"]

[project.scripts]
lab = "mechanism_lab.cli:main"
cybrgeo = "cybrgeo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cybrgeo = ["native/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_legacy"]
addopts = "-ra --import-mode=importlib"
markers = ["render: requires Mesa/EGL and FFmpeg", "release: checks delivered assets"]
