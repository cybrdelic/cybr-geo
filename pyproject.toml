[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybr-geo-core-experiment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
description = "General connected surface construction and explicit attribute-preserving edits"

[tool.setuptools.packages.find]
include = ["cybrgeo*"]

[project.optional-dependencies]
profiles = ["scipy>=1.11"]
