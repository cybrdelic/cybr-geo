[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cybrgeo"
version = "0.1.0"
description = "Reusable CAD, mesh, inspection, motion and whiteprint pipeline"
requires-python = ">=3.11"
license = "GPL-2.0-only"
dependencies = ["numpy>=1.26", "trimesh>=4.0", "cadquery>=2.6", "vtk>=9.3", "Pillow>=10", "scipy>=1.12", "cairosvg>=2.7", "ezdxf>=1.3", "numba>=0.60"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
cybrgeo = "cybrgeo.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
cybrgeo = ["native/*.cpp"]
