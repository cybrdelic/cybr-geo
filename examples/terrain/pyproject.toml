[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "cybr-terrain"
version = "0.2.0"
description = "Conservative layered terrain simulation, textured CYBR GEO geometry, and native CYBR LIGHT rendering"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-2.0-only"
dependencies = ["cybr-geo==0.6.0"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
terrain = "cybr_terrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
