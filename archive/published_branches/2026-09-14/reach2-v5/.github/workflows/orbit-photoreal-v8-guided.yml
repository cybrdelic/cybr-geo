name: ORBIT Photoreal V8 Guided

on:
  push:
    branches: [feat/orbit-photoreal-v8-guided]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 curl
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-orbit-v3-tested.txt
          python -m pip install --no-deps -e .
          python -m pip install 'mitsuba>=3.6,<3.8'
      - name: Install Intel Open Image Denoise 2.5.1
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/oidn.tar.gz \
            https://github.com/RenderKit/oidn/releases/download/v2.5.1/oidn-2.5.1.x86_64.linux.tar.gz
          echo '743c3e2aff8c220d5d70fe6cb970fb3d36f2702d2693c61d1d148e404cf37cd6  /tmp/oidn.tar.gz' | sha256sum -c -
          mkdir -p /tmp/oidn
          tar -xzf /tmp/oidn.tar.gz -C /tmp/oidn
          OIDN_ROOT=$(find /tmp/oidn -maxdepth 1 -mindepth 1 -type d -name 'oidn-*' | head -1)
          test -x "$OIDN_ROOT/bin/oidnDenoise"
          echo "$OIDN_ROOT/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$OIDN_ROOT/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Render guided ORBIT v8
        run: |
          python tools/orbit_mitsuba_photo.py \
            --out /tmp/orbit-v8 \
            --size 1000x750 \
            --spp 192 \
            --max-depth 14 \
            --hdri-resolution 2k \
            --env-rotation 205 \
            --env-scale 0.82 \
            --exposure 1.16 \
            --oidn oidnDenoise
      - name: Verify outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat
          root=Path('/tmp/orbit-v8')
          noisy=root/'ORBIT_v8_noisy.png'
          final=root/'ORBIT_v8_guided_workshop.png'
          manifest=json.loads((root/'ORBIT_v8_manifest.json').read_text())
          for p in (noisy,final):
              with Image.open(p) as im:
                  im.verify()
          with Image.open(noisy).convert('RGB') as a, Image.open(final).convert('RGB') as b:
              assert a.size==(1000,750) and b.size==a.size
              assert sum(ImageStat.Stat(ImageChops.difference(a,b)).mean)>0.15
          assert manifest['generated_imagery'] is False
          assert manifest['orbit_geometry_changed'] is False
          assert manifest['spp']==192
          assert manifest['triangles']>3_000_000
          assert manifest['environment']['license']=='CC0'
          assert 'albedo' in ' '.join(manifest['aov_channels']).lower()
          assert 'normal' in ' '.join(manifest['aov_channels']).lower()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ORBIT-photoreal-v8-guided
          path: |
            /tmp/orbit-v8/ORBIT_v8_guided_workshop.png
            /tmp/orbit-v8/ORBIT_v8_noisy.png
            /tmp/orbit-v8/ORBIT_v8_manifest.json
          if-no-files-found: error
          retention-days: 7
