name: ORBIT Photoreal V9 PBR Bench

on:
  push:
    branches: [feat/orbit-photoreal-v9-pbr-bench]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 curl
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-orbit-v3-tested.txt
          python -m pip install --no-deps -e .
          python -m pip install 'mitsuba>=3.6,<3.8'
      - name: Install Intel Open Image Denoise 2.5.1
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/oidn.tar.gz \
            https://github.com/RenderKit/oidn/releases/download/v2.5.1/oidn-2.5.1.x86_64.linux.tar.gz
          echo '743c3e2aff8c220d5d70fe6cb970fb3d36f2702d2693c61d1d148e404cf37cd6  /tmp/oidn.tar.gz' | sha256sum -c -
          mkdir -p /tmp/oidn
          tar -xzf /tmp/oidn.tar.gz -C /tmp/oidn
          OIDN_ROOT=$(find /tmp/oidn -maxdepth 1 -mindepth 1 -type d -name 'oidn-*' | head -1)
          echo "$OIDN_ROOT/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$OIDN_ROOT/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Render ORBIT v9
        run: |
          python tools/orbit_mitsuba_photo_v9.py \
            --out /tmp/orbit-v9 \
            --size 1100x825 \
            --spp 256 \
            --max-depth 14 \
            --env-rotation 195 \
            --env-scale 0.72 \
            --exposure 1.04 \
            --oidn oidnDenoise
      - name: Verify outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat
          root=Path('/tmp/orbit-v9')
          final=root/'ORBIT_v9_pbr_workshop.png'
          noisy=root/'ORBIT_v9_noisy.png'
          manifest=json.loads((root/'ORBIT_v9_manifest.json').read_text())
          for p in (final,noisy):
              with Image.open(p) as im: im.verify()
          with Image.open(final).convert('RGB') as a, Image.open(noisy).convert('RGB') as b:
              assert a.size==(1100,825) and b.size==a.size
              assert sum(ImageStat.Stat(ImageChops.difference(a,b)).mean)>0.10
          assert manifest['generated_imagery'] is False
          assert manifest['orbit_geometry_changed'] is False
          assert manifest['triangles']>3_000_000
          assert manifest['environment']['asset']=='small_workshop'
          assert manifest['environment']['license']=='CC0'
          assert manifest['bench_surface']['license']=='CC0'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ORBIT-photoreal-v9-pbr
          path: |
            /tmp/orbit-v9/ORBIT_v9_pbr_workshop.png
            /tmp/orbit-v9/ORBIT_v9_noisy.png
            /tmp/orbit-v9/ORBIT_v9_manifest.json
          if-no-files-found: error
          retention-days: 7
