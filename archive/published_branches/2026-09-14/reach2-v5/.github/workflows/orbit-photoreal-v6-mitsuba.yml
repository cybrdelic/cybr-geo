name: ORBIT Photoreal V6 Mitsuba

on:
  push:
    branches: [feat/orbit-photoreal-v6-mitsuba]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-orbit-v3-tested.txt
          python -m pip install --no-deps -e .
          python -m pip install 'mitsuba>=3.6,<3.8'
      - name: Render Mitsuba workshop proof
        run: |
          python tools/orbit_mitsuba_photo.py \
            --out /tmp/orbit-v6 \
            --size 900x675 \
            --spp 96 \
            --max-depth 14 \
            --hdri-resolution 2k \
            --env-rotation 205 \
            --env-scale 0.80 \
            --exposure 1.08
      - name: Verify output provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('/tmp/orbit-v6')
          image=root/'ORBIT_v6_mitsuba_workshop.png'
          manifest=json.loads((root/'ORBIT_v6_manifest.json').read_text())
          with Image.open(image) as im:
              im.verify()
          assert manifest['generated_imagery'] is False
          assert manifest['orbit_geometry_changed'] is False
          assert manifest['environment']['license']=='CC0'
          assert manifest['parts'] >= 148
          assert manifest['triangles'] > 3_000_000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ORBIT-photoreal-v6-mitsuba
          path: |
            /tmp/orbit-v6/ORBIT_v6_mitsuba_workshop.png
            /tmp/orbit-v6/ORBIT_v6_manifest.json
          if-no-files-found: error
          retention-days: 7
